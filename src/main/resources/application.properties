# =========================
# LLM provider
# =========================
# Packaged app (prod) uses Bedrock; `quarkus dev` uses a local Ollama.
# Both are build-time settings: override with -Dquarkus.langchain4j.chat-model.provider=... when building.
quarkus.langchain4j.chat-model.provider=bedrock
quarkus.langchain4j.embedding-model.provider=bedrock
%dev.quarkus.langchain4j.chat-model.provider=ollama
%dev.quarkus.langchain4j.embedding-model.provider=ollama

# Bedrock
# AWS credentials come from the default provider chain (env vars,
# ~/.aws/credentials, or an instance/task role). Never commit keys here.
# Choose a model enabled in your AWS account.
quarkus.langchain4j.bedrock.chat-model.model-id=${BEDROCK_MODEL_ID:anthropic.claude-3-sonnet-20240229-v1:0}
quarkus.langchain4j.bedrock.aws.region=${AWS_REGION:us-east-1}

# Ollama
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=llama3
# Embeds dietary preferences and restrictions for OpenSearch similarity search
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text
quarkus.langchain4j.ollama.timeout=60s

# Bedrock Knowledge Base (RAG)
bedrock.kb.id=${BEDROCK_KB_ID:KB1234567890ABC}
bedrock.region=${AWS_REGION:us-east-1}

# OpenSearch (vector memory, and each user's free-text dietary preferences
# and a searchable copy of their restrictions)
opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}

# Redis: each user's saved dietary restrictions, applied to every request with
# their userId. Setting the host also turns off Dev Services' Redis container.
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
# Reports Redis in /q/health/ready (the default, set here to make it visible)
quarkus.redis.health.enabled=true

# =========================
# Authentication (OIDC)
# =========================
# The /users/{userId} and /me endpoints need an access token from the OIDC
# provider (e.g. AWS Cognito or Keycloak), and a user may only reach their own
# profile: {userId} must be the token's principal (by default its upn,
# preferred_username or sub claim; set QUARKUS_OIDC_TOKEN_PRINCIPAL_CLAIM to
# use another, e.g. "username" for Cognito access tokens).
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${OIDC_CLIENT_ID:recipetool}
# The packaged app needs the provider's URL, e.g.
# https://cognito-idp.us-east-1.amazonaws.com/us-east-1_AbCdEf or
# https://keycloak.example.com/realms/recipetool
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
# Guests (no token) may generate this many recipes before having to sign in;
# counted in Redis per guest id (a cookie the frontend sets) for the window.
# Meal plans and profiles always need a signed-in user.
recipe.guest.free-recipes=4
recipe.guest.window=30d
# `quarkus dev` starts Keycloak in Docker instead (realm "quarkus", users
# alice/alice and bob/bob), on a fixed port so the frontend can find it
%dev.quarkus.keycloak.devservices.port=8180

# =========================
# Kafka (MSK)
# =========================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
camel.component.kafka.brokers=${kafka.bootstrap.servers}
# Fail a send after 5s instead of Kafka's default 60s when brokers are unreachable
camel.component.kafka.max-block-ms=5000

# Camel send retries; after the last one the message goes to the dead-letter topic
recipe.camel.max-redeliveries=3
recipe.camel.redelivery-delay=500ms
recipe.camel.dead-letter-uri=kafka:recipe-requests-dlq
# If the dead-letter topic is unreachable too, messages are saved as files here
recipe.camel.dead-letter-fallback-uri=file:${DEAD_LETTER_DIR:dead-letters}

# How long to wait for the Flink job's score before returning the unscored recipe
recipe.flink.timeout=5s

# Messages are JSON strings serialized in code.
mp.messaging.outgoing.recipe-requests.connector=smallrye-kafka
mp.messaging.outgoing.recipe-requests.topic=recipe-requests
mp.messaging.outgoing.recipe-requests.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.recipe-responses.connector=smallrye-kafka
mp.messaging.incoming.recipe-responses.topic=recipe-responses
mp.messaging.incoming.recipe-responses.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Each instance must see every response, because the request waiting for it may be on any instance.
mp.messaging.incoming.recipe-responses.group.id=recipetool-${quarkus.uuid}
mp.messaging.incoming.recipe-responses.auto.offset.reset=latest

mp.messaging.outgoing.recipe-search-out.connector=smallrye-kafka
mp.messaging.outgoing.recipe-search-out.topic=recipe-search-events
mp.messaging.outgoing.recipe-search-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Written by the Flink UserPreferenceJob; used to personalise meal plans.
# Each instance keeps every user's preferences in memory, so it reads the whole topic on startup.
mp.messaging.incoming.user-preferences.connector=smallrye-kafka
mp.messaging.incoming.user-preferences.topic=user-preferences
mp.messaging.incoming.user-preferences.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.user-preferences.group.id=recipetool-preferences-${quarkus.uuid}
mp.messaging.incoming.user-preferences.auto.offset.reset=earliest

# Spoonacular recipe API, used by POST /meal-plan and the meal-planner MCP tool.
# Get a free key at https://spoonacular.com/food-api; without one, meal plans return 503.
quarkus.rest-client.spoonacular.url=https://api.spoonacular.com
quarkus.rest-client.spoonacular.connect-timeout=5000
quarkus.rest-client.spoonacular.read-timeout=15000
spoonacular.api-key=${SPOONACULAR_API_KEY:}
